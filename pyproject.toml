[project]
name = "quant-agent"
version = "0.1.0"
description = "AI-powered quantitative trading agent system"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "QuantAgent Team"}
]
keywords = ["quantitative", "trading", "ai", "agent", "llm"]

dependencies = [
    # Core
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",

    # LLM & Agents
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",

    # Data
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "yfinance>=0.2.0",
    "ccxt>=4.0.0",
    "akshare>=1.12.0",

    # Technical Analysis
    "ta-lib>=0.4.28",
    "pandas-ta>=0.3.14b",

    # Backtesting
    "backtrader>=1.9.78",
    "vectorbt>=0.26.0",

    # API
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "websockets>=12.0",

    # Dashboard
    "streamlit>=1.30.0",
    "plotly>=5.18.0",

    # Database
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "redis>=5.0.0",

    # Async & Task
    "aiohttp>=3.9.0",
    "httpx>=0.26.0",
    "celery>=5.3.0",

    # Utils
    "rich>=13.0.0",
    "loguru>=0.7.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
quant-agent = "quant_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
